<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<title>Jomayo Tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polygon fill='%231d9bf0' points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26'/></svg>" />
<style>
  :root {
    --bg: #000; --hover: #080808; --pill: #181919; --card: #16181c; --line: #2f3336;
    --text: #e7e9ea; --muted: #71767b; --blue: #1d9bf0; --blue-h: #1a8cd8;
    --blue-soft: rgba(29,155,240,.12); --nav-bg: rgba(0,0,0,.65);
  }
  [data-theme="dim"] {
    --bg: #15202b; --hover: #192734; --pill: #1e2732; --card: #1e2732; --line: #38444d;
    --text: #f7f9f9; --muted: #8b98a5; --nav-bg: rgba(21,32,43,.75);
  }
  [data-theme="light"] {
    --bg: #fff; --hover: #f7f9f9; --pill: #eff3f4; --card: #f7f9f9; --line: #eff3f4;
    --text: #0f1419; --muted: #536471; --nav-bg: rgba(255,255,255,.8);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.33; -webkit-font-smoothing: antialiased; transition: background .2s, color .2s;
  }
  html, body { height: 100%; overflow: hidden; }
  b, strong { font-weight: 600; }
  .i { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ── sidebar + one wide column ── */
  .layout { display: grid; grid-template-columns: 275px minmax(0, 1100px); justify-content: center; height: 100vh; height: 100dvh; }

  /* left sidebar */
  .side { height: 100%; padding: 0 12px; display: flex; flex-direction: column; }
  .logo {
    width: 52px; height: 52px; margin: 2px 0; border-radius: 50%; display: grid; place-items: center;
    transition: background .15s; color: var(--blue);
  }
  .logo .i { width: 28px; height: 28px; stroke-width: 2; }
  .logo:hover { background: var(--pill); }
  .nav { display: flex; flex-direction: column; align-items: stretch; margin-top: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 999px;
    font-size: 16px; transition: background .15s; width: 100%;
  }
  .nav a:hover { background: var(--pill); }
  .nav a .ic { width: 26px; display: grid; place-items: center; flex: none; }
  .nav a .ic .i { width: 24px; height: 24px; }
  .nav a.active .ic .i { stroke-width: 2.2; }
  .nav a .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4px; }
  .nav a.active { font-weight:600; background: var(--blue-soft); }
  .gh {
    margin: 16px 0 0; width: 90%; text-align: center; background: var(--blue); color: #fff; font-weight:600; font-size: 15px;
    padding: 12px 0; border-radius: 999px; transition: background .15s;
  }
  .gh:hover { background: var(--blue-h); }
  .me {
    margin: auto 0 12px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 999px; transition: background .15s;
  }
  .me:hover { background: var(--pill); }
  .me .av { width: 40px; height: 40px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
  .me .av .i { width: 20px; height: 20px; }
  .me b { display: block; font-weight:600; }
  .me span { color: var(--muted); font-size: 14px; }

  /* center: header + the open tool */
  .main { border-inline: 1px solid var(--line); min-width: 0; height: 100%; overflow: hidden; }
  .head {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 16px; height: 53px; background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .head h1 { font-size: 18px; font-weight:600; line-height: 1.1; }
  .head small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .themes { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .themes button {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight:600;
    padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s;
  }
  .themes button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .themes button:not([aria-pressed="true"]):hover { color: var(--text); }
  .frame { display: block; width: 100%; height: calc(100vh - 53px); height: calc(100dvh - 53px); border: 0; background: var(--bg); }

  /* ── responsive: same steps X uses ── */
  @media (max-width: 1280px) {
    .layout { grid-template-columns: 88px minmax(0, 1100px); }
    .nav { align-items: center; }
    .nav a { padding: 12px; width: auto; }
    .nav a .lb, .gh, .me div { display: none; }
    .logo, .me { margin-inline: auto; }
    .me { padding: 8px; }
  }
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .main { border-inline: 0; padding-bottom: 56px; }
    .frame { height: calc(100vh - 53px - 56px); height: calc(100dvh - 53px - 56px); }
    .side {
      position: fixed; inset: auto 0 0 0; top: auto; height: 56px; z-index: 10; flex-direction: row; padding: 0 4px;
      background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: content-box;
    }
    .logo, .me, .gh { display: none; }
    .nav { flex-direction: row; justify-content: space-around; width: 100%; margin: 0; }
    .nav a { padding: 8px; width: auto; }
    .themes button { padding: 5px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol><symbol id="i-toolbox" viewBox="0 0 24 24"><path d="M3 8h18v12H3z"/><path d="M8 8V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3"/><path d="M3 13h18"/></symbol><symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol><symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><symbol id="i-top" viewBox="0 0 24 24"><path d="M5 3h14"/><path d="m18 13-6-6-6 6"/><path d="M12 7v14"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol><symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol><symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></symbol><symbol id="i-folder-open" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol><symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol><symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol></defs></svg>

<div class="layout">

  <!-- left sidebar: the tools -->
  <header class="side">
    <a class="logo" href="#" aria-label="Home"><svg class="i" aria-hidden="true"><use href="#i-star"/></svg></a>
    <nav class="nav" id="nav" aria-label="Tools"></nav>
    <a class="gh" href="https://github.com/joremacerado1999-lgtm/data-utilities" target="_blank" rel="noopener">GitHub</a>
    <a class="me" href="https://github.com/joremacerado1999-lgtm/data-utilities" target="_blank" rel="noopener">
      <div class="av" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="#i-toolbox"/></svg></div>
      <div><b>Jomayo</b><span>@data-utilities</span></div>
    </a>
  </header>

  <!-- center: the selected tool opens here -->
  <main class="main">
    <div class="head">
      <div><h1 id="title"></h1><small id="tag"></small></div>
      <div class="themes" role="group" aria-label="Theme">
        <button data-set="light" aria-pressed="false">Light</button>
        <button data-set="dim" aria-pressed="false">Dim</button>
        <button data-set="dark" aria-pressed="true">Dark</button>
      </div>
    </div>
    <iframe class="frame" id="frame" title="Tool"></iframe>
  </main>

</div>

<script>
  // To add a tool, add one line here.
  const TOOLS = [
    { icon: "clipboard", name: "For Summary Template", tag: "for process",     href: "summary-tool.html" },
    { icon: "inbox", name: "Email Lookup",         tag: "get email",       href: "email-lookup.html" },
    { icon: "file", name: "Get Reference Code",   tag: "from DLX",        href: "reference-code.html" },
    { icon: "calendar", name: "PIF NEW ENDO Mapper",  tag: "excel processor", href: "pif-new-endo-mapper.html" },
    { icon: "top", name: "For Passes",           tag: "excel processor", href: "for-passes.html" }
  ];

  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ic = n => '<svg class="i" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  const slug = h => h.replace(/\.html$/, '');
  const frame = document.getElementById('frame'), title = document.getElementById('title'), tag = document.getElementById('tag');

  // sidebar
  document.getElementById('nav').innerHTML = TOOLS.map(t =>
    `<a data-s="${esc(slug(t.href))}" href="#${esc(slug(t.href))}" title="${esc(t.name)}"><span class="ic">${ic(t.icon)}</span><span class="lb">${esc(t.name)}</span></a>`
  ).join('');

  // theme: Light / Dim / Dark
  const root = document.documentElement, btns = document.querySelectorAll('.themes button');
  function setTheme(t) {
    root.dataset.theme = t;
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.set === t));
    try { localStorage.setItem('theme', t); } catch (e) {}
    try { frame.contentWindow.postMessage({ theme: t }, '*'); } catch (e) {}
  }
  let saved = 'dark';
  try { saved = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  setTheme(saved);
  btns.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.set)));

  // open the chosen tool in the center (the first one by default)
  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const t = TOOLS.find(x => slug(x.href) === id) || TOOLS[0];
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.s === slug(t.href)));
    title.textContent = t.name;
    tag.textContent = t.tag;
    document.title = t.name + ' · Jomayo Tools';
    if (frame.dataset.src !== t.href) { frame.dataset.src = t.href; frame.src = t.href + '?theme=' + root.dataset.theme; }
  }
  addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
